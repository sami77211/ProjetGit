<div class="dashboard-container">
    <div class="quick-stats">
      <mat-card class="stat-card">
        <mat-card-content>
          <div class="stat-icon">
            <mat-icon>account_balance</mat-icon>
          </div>
          <div class="stat-details">
            <h3>Total Budget</h3>
            <p class="amount">${{totalBudget | number:'1.2-2'}}</p>
            <p class="trend positive">+5.2% vs last month</p>
          </div>
        </mat-card-content>
      </mat-card>
  
      <mat-card class="stat-card">
        <mat-card-content>
          <div class="stat-icon expenses">
            <mat-icon>shopping_cart</mat-icon>
          </div>
          <div class="stat-details">
            <h3>Total Expenses</h3>
            <p class="amount">${{totalExpenses | number:'1.2-2'}}</p>
            <p class="trend negative">-2.8% vs last month</p>
          </div>
        </mat-card-content>
      </mat-card>
  
      <mat-card class="stat-card">
        <mat-card-content>
          <div class="stat-icon savings">
            <mat-icon>savings</mat-icon>
          </div>
          <div class="stat-details">
            <h3>Remaining Budget</h3>
            <p class="amount">${{remainingBudget | number:'1.2-2'}}</p>
            <p class="trend neutral">0% change</p>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  
    <div class="charts-container">
      <mat-card class="chart-card">
        <mat-card-header>
          <mat-card-title>Budget Allocation</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div id="budget-pie-chart">
            <apx-chart [series]="pieChartOptions.series" [chart]="pieChartOptions.chart" [labels]="pieChartOptions.labels" [colors]="pieChartOptions.colors" [responsive]="pieChartOptions.responsive"></apx-chart>
          </div>
        </mat-card-content>
      </mat-card>
  
      <mat-card class="chart-card">
        <mat-card-header>
          <mat-card-title>Monthly Expenses Trend</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div id="expense-line-chart">
            <apx-chart [series]="lineChartOptions.series" [chart]="lineChartOptions.chart" [xaxis]="lineChartOptions.xaxis" [stroke]="lineChartOptions.stroke" [colors]="lineChartOptions.colors" [dataLabels]="lineChartOptions.dataLabels"></apx-chart>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
